{% extends "base.html" %}
{#
  Org-site template override (utPLSQL.github.io).
  Loads the same shared topbar as all sub-sites — single source of truth in topbar.js.
#}

{% block extrahead %}
  {{ super() }}
  <script>
    window.utplsqlBaseUrl = "{{ config.site_url }}";
    document.documentElement.setAttribute('data-utplsql-site', 'org');
  </script>
  <script src="{{ base_url }}/assets/topbar.js" defer></script>
{% endblock %}
